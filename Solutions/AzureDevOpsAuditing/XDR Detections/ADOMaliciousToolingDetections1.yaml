properties:
  id: xdr-bc71cf84-c02c-4c0a-a64c-306d84f9ff89
  displayName: Azure DevOps Audit Detection for known malicious tooling
  status: disabled
  queryCondition:
    queryText: |-
      ADOAuditLogs
      // Look for known bad user agents
      | where UserAgent has_any ("ADOKit")
      | extend timestamp = TimeGenerated
      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps Audit Detection for known malicious tooling
      description: '''Azure DevOps has been targeted over the years with a handful of toolkits.  This detection will look
        for some common signs known for a few of these tools.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1119
      customDetails:
        AccountFullName: ActorUPN
