properties:
  id: xdr-4d8de9e6-263e-4845-8618-cd23a4f58b70
  displayName: Azure DevOps Pull Request Policy Bypassing - Historic allow list
  status: disabled
  queryCondition:
    queryText: |-
      let starttime = 14d;
      let endtime = 3h;
      // Add full UPN (user@domain.com) to Authorized Bypassers to ignore policy bypasses by certain authorized users
      let AuthorizedBypassers = dynamic(['foo@baz.com', 'test@foo.com']);
      let historicBypassers = ADOAuditLogs
      | where TimeGenerated between (ago(starttime) .. ago(endtime))
      | where OperationName == 'Git.RefUpdatePoliciesBypassed'
      | distinct ActorUPN;
      ADOAuditLogs
      | where TimeGenerated >= ago(endtime)
      | where OperationName == 'Git.RefUpdatePoliciesBypassed'
      | where ActorUPN !in (historicBypassers) and ActorUPN !in (AuthorizedBypassers)
      | parse ScopeDisplayName with OrganizationName '(Organization)'
      | project TimeGenerated, ActorUPN, IpAddress, UserAgent, OrganizationName, ProjectName, RepoName = Data.RepoName, AlertDetails = Details, Branch = Data.Name,
        BypassReason = Data.BypassReason, PRLink = strcat('https://dev.azure.com/', OrganizationName, '/', ProjectName, '/_git/', Data.RepoName, '/pullrequest/', Data.PullRequestId)
      | extend timestamp = TimeGenerated
      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])
  schedule:
    frequency: PT3H
  detectionAction:
    alertTemplate:
      title: Azure DevOps Pull Request Policy Bypassing - Historic allow list
      description: '''This detection builds an allow list of historic PR policy bypasses and compares to recent history, flagging
        pull request bypasses that are not manually in the allow list and not historically included in the allow list.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
        urls:
        - id: url1
          addressColumn: PRLink
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: ActorUPN
