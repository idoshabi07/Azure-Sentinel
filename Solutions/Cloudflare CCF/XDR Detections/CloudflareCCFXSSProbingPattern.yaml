properties:
  id: xdr-4d9d00b9-31a6-49e4-88c1-9e68277053ad
  displayName: Cloudflare - XSS probing pattern in request
  status: disabled
  queryCondition:
    queryText: 'let s_threshold = 3;

      Cloudflare

      | where HttpRequestMethod in~ (''POST'', ''PUT'')

      | extend susp_ch = countof(ClientRequestURI, ''%00'')

      | where ClientRequestURI matches regex @''(alert\()|(alert\%28)|(String\.fromCharCode\()|(expression\(alert)''
      or susp_ch > s_threshold

      | extend CompleteUrl = strcat(HttpRequestHeaderHost,ClientRequestPath)'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - XSS probing pattern in request
      description: '''Detects XSS probing patterns.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        urls:
        - id: url1
          addressColumn: CompleteUrl
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
