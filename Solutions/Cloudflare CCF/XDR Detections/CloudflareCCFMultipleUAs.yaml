properties:
  id: xdr-fc50076a-0275-43d5-b9dd-38346c061f68
  displayName: Cloudflare - Multiple user agents for single source
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      Cloudflare

      | where isnotempty(HttpUserAgentOriginal)

      | summarize d_ua = dcount(HttpUserAgentOriginal) by SrcIpAddr, bin(TimeGenerated,
      3m)

      | where d_ua > threshold'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Multiple user agents for single source
      description: '''Detects requests with different user agents from one source
        in short timeframe.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
