properties:
  id: xdr-7313352a-09f6-4a84-88bd-6f17f1cbeb88
  displayName: Cloudflare - Unexpected POST requests
  status: disabled
  queryCondition:
    queryText: 'Cloudflare

      | where HttpRequestMethod in~ (''POST'', ''PUT'')

      | where tostring(HttpStatusCode) startswith ''2''

      | where DstBytes != 0 or SrcBytes != 0

      | extend fe = extract(@''.*(\.\w+)$'', 1, ClientRequestURI)

      | where fe in~ (''.jpg'', ''.jpeg'', ''.gif'', ''.png'', ''.icon'', ''.ico'',
      ''.xml'', ''.swf'', ''.svg'', ''.ppt'', ''.pttx'', ''.doc'', ''.docx'', ''.rtf'',
      ''.pdf'', ''.tif'', ''.zip'', ''.mov'')'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Unexpected POST requests
      description: '''Detects post requests to unusual extensions.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1505
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
