  queryCondition:
    queryText: 'let ip_reputation = dynamic([''unknown'', ''badHost'', ''greylist'',
      ''securityScanner'', ''scan'', ''tor'']);

      Cloudflare

      | where ClientIPClass in~ (ip_reputation)

      | extend CompleteUrl = strcat(HttpRequestHeaderHost,ClientRequestPath)'
