  displayName: Cloudflare - Multiple error requests from single source
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      Cloudflare

      | where HttpRequestMethod =~ ''GET''

      | summarize err_cnt = count() by SrcIpAddr, bin(TimeGenerated, 5m)

      | where err_cnt > threshold'
  schedule:
    frequency: PT1H
  detectionAction:
