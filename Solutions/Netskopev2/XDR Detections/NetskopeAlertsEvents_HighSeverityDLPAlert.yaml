properties:
  id: xdr-04e36dfa-05b3-45bd-b39f-28b6fac71337
  displayName: Netskope - High Severity DLP Alert
  status: disabled
  queryCondition:
    queryText: |-
      NetskopeAlerts_CL
      | where TimeGenerated > ago(1h)
      | where alert_type =~ "dlp"
      | where severity has_any ("high", "critical")
      | summarize
          AlertCount = count(),
          DlpRules = make_set(dlp_rule, 20),
          DlpProfiles = make_set(dlp_profile, 20),
          Apps = make_set(app, 20),
          FilePaths = make_set(file_path, 20),
          FirstSeen = min(TimeGenerated),
          LastSeen = max(TimeGenerated)
          by User = user, UserIp = userip, HostName = hostname, AlertName = alert_name, Severity = severity
      | order by AlertCount desc
      | project
          LastSeen,
          AlertName,
          Severity,
          User,
          UserIp,
          HostName,
          AlertCount,
          Apps,
          DlpRules,
          DlpProfiles,
          FilePaths,
          FirstSeen
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Netskope - High Severity DLP Alert
      description: |-
        Detects Netskope DLP (Data Loss Prevention) alerts raised with high or critical severity.
        These alerts indicate sensitive data (e.g. PII, source code, financial records) matched a
        DLP policy during upload, download, or sharing and may represent data exfiltration.
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: UserIp
        hosts:
        - id: host1
          nameColumn: HostName
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      - tactic: Collection
        techniques:
        - technique: T1005
      customDetails:
        AccountName: User
