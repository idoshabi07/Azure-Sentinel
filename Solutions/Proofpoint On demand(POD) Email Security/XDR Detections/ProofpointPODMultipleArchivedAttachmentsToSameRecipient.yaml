properties:
  id: xdr-bda5a2bd-979b-4828-a91f-27c2a5048f7f
  displayName: ProofpointPOD - Multiple archived attachments to the same recipient
  status: disabled
  queryCondition:
    queryText: 'let lbtime = 30m;

      let msgthreshold = 3;

      let compressedTypes = dynamic([''zip'', ''rar'', ''tar'', ''x-7z-compressed'']);

      ProofpointPOD

      | where TimeGenerated > ago(lbtime)

      | where EventType == ''message''

      | where NetworkDirection == ''outbound''

      | extend attachedMimeType = todynamic(MsgParts)[0][''detectedMime'']

      | where attachedMimeType has_any (compressedTypes)

      | summarize count(), make_set(attachedMimeType) by SrcUserUpn, DstUserUpn

      | where count_ > msgthreshold

      | extend AccountCustomEntity = SrcUserUpn'
  schedule:
    frequency: PT30M
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Multiple archived attachments to the same recipient
      description: '''Detects when multiple emails where sent to the same recipient
        with large archived attachments.'''
      severity: medium
      entityMappings:
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        AccountFullName: AccountCustomEntity
