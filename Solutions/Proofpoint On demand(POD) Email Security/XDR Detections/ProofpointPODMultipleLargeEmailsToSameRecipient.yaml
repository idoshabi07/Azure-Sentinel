properties:
  id: xdr-d1aba9a3-5ab1-45ef-8ed4-da57dc3c0d32
  displayName: ProofpointPOD - Multiple large emails to the same recipient
  status: disabled
  queryCondition:
    queryText: 'let lbtime = 30m;

      let msgthreshold = 3;

      let msgszthreshold = 3000000;

      ProofpointPOD

      | where TimeGenerated > ago(lbtime)

      | where EventType == ''message''

      | where NetworkDirection == ''outbound''

      | where NetworkBytes > msgszthreshold

      | summarize count() by SrcUserUpn, DstUserUpn

      | where count_ > msgthreshold

      | extend AccountCustomEntity = SrcUserUpn'
  schedule:
    frequency: PT30M
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Multiple large emails to the same recipient
      description: '''Detects when multiple emails with large size where sent to the
        same recipient.'''
      severity: medium
      entityMappings:
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        AccountFullName: AccountCustomEntity
