properties:
  id: xdr-aedc5b33-2d7c-42cb-a692-f25ef637cbb1
  displayName: ProofpointPOD - Possible data exfiltration to private email
  status: disabled
  queryCondition:
    queryText: 'let lbtime = 10m;

      ProofpointPOD

      | where TimeGenerated > ago(lbtime)

      | where EventType == ''message''

      | where NetworkDirection == ''outbound''

      | where array_length(todynamic(DstUserUpn)) == 1

      | extend sender = extract(@''\A(.*?)@'', 1, SrcUserUpn)

      | extend sender_domain = extract(@''@(.*)$'', 1, SrcUserUpn)

      | extend recipient = extract(@''\A(.*?)@'', 1, tostring(todynamic(DstUserUpn)[0]))

      | extend recipient_domain = extract(@''@(.*)$'', 1, tostring(todynamic(DstUserUpn)[0]))

      | where sender =~ recipient

      | where sender_domain != recipient_domain

      | project SrcUserUpn, DstUserUpn

      | extend AccountCustomEntity = SrcUserUpn'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Possible data exfiltration to private email
      description: '''Detects when sender sent email to the non-corporate domain and
        recipient''s username is the same as sender''s username.'''
      severity: medium
      entityMappings:
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
