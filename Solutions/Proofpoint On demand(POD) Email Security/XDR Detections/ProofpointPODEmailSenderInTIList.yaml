properties:
  id: xdr-35a0792a-1269-431e-ac93-7ae2980d4dde
  displayName: ProofpointPOD - Email sender in TI list
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nThreatIntelligenceIndicator\n\
      | where TimeGenerated >= ago(ioc_lookBack) and ExpirationDateTime > now()\n\
      | where Active == true\n| where isnotempty(EmailSenderAddress)\n| extend TI_emailEntity\
      \ = EmailSenderAddress\n// using innerunique to keep perf fast and result set\
      \ low, we only need one match to indicate potential malicious activity that\
      \ needs to be investigated\n| join kind=innerunique (\n       ProofpointPOD\n\
      \       | where TimeGenerated >= ago(dt_lookBack)\n       | where isnotempty(SrcUserUpn)\n\
      \       | extend ProofpointPOD_TimeGenerated = TimeGenerated, ClientEmail =\
      \ SrcUserUpn\n)\non $left.TI_emailEntity == $right.ClientEmail\n| where ProofpointPOD_TimeGenerated\
      \ < ExpirationDateTime\n| summarize ProofpointPOD_TimeGenerated = arg_max(ProofpointPOD_TimeGenerated,\
      \ *) by IndicatorId, ClientEmail\n| project ProofpointPOD_TimeGenerated, Description,\
      \ IndicatorId, ThreatType, ExpirationDateTime, ConfidenceScore, ClientEmail\n\
      | extend timestamp = ProofpointPOD_TimeGenerated"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Email sender in TI list
      description: '''Email sender in TI list.'''
      severity: medium
      entityMappings:
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: ClientEmail
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: ClientEmail
