properties:
  id: xdr-eb68b129-5f17-4f56-bf6d-dde48d5e615a
  displayName: ProofpointPOD - Binary file in attachment
  status: disabled
  queryCondition:
    queryText: 'let lbtime = 10m;

      let binaryTypes = dynamic([''zip'', ''octet-stream'', ''java-archive'', ''rar'',
      ''tar'', ''x-7z-compressed'', ''x-msdownload'', ''portable-executable'']);

      ProofpointPOD

      | where TimeGenerated > ago(lbtime)

      | where EventType == ''message''

      | where NetworkDirection == ''inbound''

      | where FilterDisposition !in (''reject'', ''discard'')

      | extend attachedMimeType = tostring(todynamic(MsgParts)[0][''detectedMime''])

      | where attachedMimeType has_any (binaryTypes)

      | project SrcUserUpn, AccountCustomEntity = tostring(parse_json(DstUserUpn)[0]),
      attachedMimeType, MsgHeaderSubject

      | extend Name = tostring(split(AccountCustomEntity, "@")[0]), UPNSuffix = tostring(split(AccountCustomEntity,
      "@")[1])'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Binary file in attachment
      description: '''Detects when email received with binary file as attachment.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
