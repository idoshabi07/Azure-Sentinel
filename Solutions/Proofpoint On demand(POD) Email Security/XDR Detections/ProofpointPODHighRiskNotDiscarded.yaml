properties:
  id: xdr-c7cd6073-6d2c-4284-a5c8-da27605bdfde
  displayName: ProofpointPOD - High risk message not discarded
  status: disabled
  queryCondition:
    queryText: 'let lbtime = 10m;

      ProofpointPOD

      | where TimeGenerated > ago(lbtime)

      | where EventType == ''message''

      | where NetworkDirection == ''inbound''

      | where FilterDisposition !in (''reject'', ''discard'')

      | where FilterModulesSpamScoresOverall == ''100''

      | project SrcUserUpn, DstUserUpn

      | extend AccountCustomEntity = SrcUserUpn'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - High risk message not discarded
      description: '''Detects when email with high risk score was not rejected or
        discarded by filters.'''
      severity: low
      entityMappings:
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountFullName: AccountCustomEntity
