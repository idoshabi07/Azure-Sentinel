properties:
  id: xdr-f6a51e2c-2d6a-4f92-a090-cfb002ca611f
  displayName: ProofpointPOD - Suspicious attachment
  status: disabled
  queryCondition:
    queryText: 'let lbtime = 10m;

      let disallowed_ext = dynamic([''ps1'', ''exe'', ''vbs'', ''js'', ''scr'']);

      ProofpointPOD

      | where TimeGenerated > ago(lbtime)

      | where EventType == ''message''

      | where NetworkDirection == ''inbound''

      | where FilterDisposition !in (''reject'', ''discard'')

      | extend attachedExt = todynamic(MsgParts)[0][''detectedExt'']

      | where tolower(attachedExt) in (disallowed_ext)

      | project SrcUserUpn, AccountCustomEntity = tostring(parse_json(DstUserUpn)[0]),
      attachedExt'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Suspicious attachment
      description: '''Detects when email contains suspicious attachment (file type).'''
      severity: medium
      entityMappings:
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountFullName: AccountCustomEntity
