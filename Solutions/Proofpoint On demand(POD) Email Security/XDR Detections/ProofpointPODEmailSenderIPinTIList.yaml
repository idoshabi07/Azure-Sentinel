properties:
  id: xdr-78979d32-e63f-4740-b206-cfb300c735e0
  displayName: ProofpointPOD - Email sender IP in TI list
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nThreatIntelligenceIndicator\n\
      | where TimeGenerated >= ago(ioc_lookBack) and ExpirationDateTime > now()\n\
      | where isnotempty(NetworkIP) or isnotempty(EmailSourceIpAddress) or isnotempty(NetworkDestinationIP)\
      \ or isnotempty(NetworkSourceIP)\n| extend TI_ipEntity = iff(isnotempty(NetworkIP),\
      \ NetworkIP, NetworkDestinationIP)\n| extend TI_ipEntity = iff(isempty(TI_ipEntity)\
      \ and isnotempty(NetworkSourceIP), NetworkSourceIP, TI_ipEntity)\n| extend TI_ipEntity\
      \ = iff(isempty(TI_ipEntity) and isnotempty(EmailSourceIpAddress), EmailSourceIpAddress,\
      \ TI_ipEntity)\n| summarize LatestIndicatorTime = arg_max(TimeGenerated, *)\
      \ by IndicatorId\n| where Active == true\n// using innerunique to keep perf\
      \ fast and result set low, we only need one match to indicate potential malicious\
      \ activity that needs to be investigated\n| join kind=innerunique (\n      \
      \    ProofpointPOD\n          | where TimeGenerated >= ago(dt_lookBack)\n  \
      \        | where isnotempty(SrcIpAddr)\n          | extend ProofpointPOD_TimeGenerated\
      \ = TimeGenerated, ClientIP = SrcIpAddr\n  )\non $left.TI_ipEntity == $right.ClientIP\n\
      | where ProofpointPOD_TimeGenerated < ExpirationDateTime\n| summarize ProofpointPOD_TimeGenerated\
      \ = arg_max(ProofpointPOD_TimeGenerated, *) by IndicatorId, ClientIP\n| project\
      \ ProofpointPOD_TimeGenerated, SrcUserUpn, DstUserUpn, SrcIpAddr, IndicatorId,\
      \ ThreatType, ExpirationDateTime, ConfidenceScore,\nTI_ipEntity, ClientIP\n\
      | extend timestamp = ProofpointPOD_TimeGenerated"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: ProofpointPOD - Email sender IP in TI list
      description: '''Email sender IP in TI list.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
        mailboxes:
        - id: mailbox1
          primaryAddressColumn: SrcUserUpn
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: SrcUserUpn
